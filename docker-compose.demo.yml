# Web-demo overlay — run together with the base file:
#   docker compose --env-file .env.demo -f docker-compose.yml -f docker-compose.demo.yml up --build -d
# Secrets and environment-specific URLs live in .env.demo (never committed);
# see .env.demo.example for the full list.
services:
  demo:
    build:
      context: .
      target: demo
    depends_on:
      plugsiam:
        condition: service_started
    environment:
      MOCK_BASE_URL: http://plugsiam:8080
      MOCK_ADMIN_KEY: ${MOCK_ADMIN_KEY:-plg-admin-key}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      EVOLT_VERSIONS_URL: ${EVOLT_VERSIONS_URL:-}
      EVOLT_ORCH_URL: ${EVOLT_ORCH_URL:-}
      EVOLT_ADAPTER_URL: ${EVOLT_ADAPTER_URL:-}
      EVOLT_ROAMING_URL: ${EVOLT_ROAMING_URL:-}
      EVOLT_COREAUTH_URL: ${EVOLT_COREAUTH_URL:-}
      EVOLT_ORCH_API_KEY: ${EVOLT_ORCH_API_KEY:-}
      EVOLT_ROAMING_API_KEY: ${EVOLT_ROAMING_API_KEY:-}
      DEMO_ALLOWED_STATION_IDS: ${DEMO_ALLOWED_STATION_IDS:-}
      DEMO_ENABLE_KAFKA: ${DEMO_ENABLE_KAFKA:-true}
      DEMO_KAFKA_BROKER: ${DEMO_KAFKA_BROKER:-}
      DEMO_KAFKA_PARTITION: ${DEMO_KAFKA_PARTITION:-2}
      DEMO_KAFKA_STATION_ID: ${DEMO_KAFKA_STATION_ID:-}
      DEMO_KAFKA_EVSE_UID: ${DEMO_KAFKA_EVSE_UID:-}
      DEMO_KAFKA_EVSE_ID: ${DEMO_KAFKA_EVSE_ID:-}
      DEMO_KAFKA_OCPI_EVSE_UID: ${DEMO_KAFKA_OCPI_EVSE_UID:-}
      DEMO_KAFKA_PARTY_CC: ${DEMO_KAFKA_PARTY_CC:-TH}
      DEMO_KAFKA_PARTY_ID: ${DEMO_KAFKA_PARTY_ID:-EVO}
      # Evolt's CPO tariffs feed builds every object before paging, so one page
      # costs ~19s no matter the limit. The chain has to outlast that.
      DEMO_TIMEOUT_SECONDS: ${DEMO_TIMEOUT_SECONDS:-60}
    ports:
      - "9100:8080"

  # Only needed when cloudflared is NOT installed on the host. The dashboard's
  # install command registers a launchd/systemd service that survives reboots,
  # which is the better setup — in that case point the tunnel's public hostname
  # at http://localhost:9100 and leave this profile off. Running both replicas
  # is what breaks: they share one route, and only one of the two addresses
  # (localhost:9100 vs demo:8080) resolves per replica.
  #   docker compose --profile tunnel ... up   → run it here instead
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on:
      - demo
    restart: unless-stopped

  # Evolt's orch on dev advertises its versions URL as in-cluster DNS; this
  # shim answers that name inside the compose network and rewrites Host so the
  # dev ingress routes it. Remove once the team points orch's base_url at bff.
  evolt-shim:
    image: caddy:2-alpine
    volumes:
      - ./deploy/Caddyfile.shim:/etc/caddy/Caddyfile:ro
    networks:
      default:
        aliases:
          - orch-ocpi-service.aurora-dev.svc.cluster.local

  # The tunnel URL is what Evolt must call back — override the local BASE_URL.
  plugsiam:
    environment:
      BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:9101}
      OUTBOUND_TIMEOUT_SECONDS: ${MOCK_OUTBOUND_TIMEOUT_SECONDS:-45}
